<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0b0a12">
<title>Gymdom</title>
<meta name="apple-mobile-web-app-title" content="Gymdom">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" id="appleIcon" href="apple-touch-icon.png">
<link rel="icon" id="favIcon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b0a12;--panel:#15141f;--panel2:#1d1c2b;--line:#2a2839;--text:#eeedf7;--mute:#8e8aa8;--teal:#4fd1c5;--gold:#f2c94c;--purple:#a78bfa;--red:#f2667a;--base:#272637;--untrained:#3b3a52}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
body{padding-bottom:calc(80px + env(safe-area-inset-bottom))}
.top{position:sticky;top:0;z-index:5;display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;background:rgba(11,10,18,.88);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;font-family:'Chakra Petch';font-weight:700;letter-spacing:.14em;font-size:17px}
.logo{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;background:linear-gradient(135deg,var(--teal),var(--gold));color:#0b0a12;font-size:13px;letter-spacing:0}
main{max-width:560px;margin:0 auto;padding:16px}
h1,h2,h3{font-family:'Chakra Petch';letter-spacing:.04em;margin:0 0 10px;font-weight:700}
h2{font-size:22px}h3{font-size:16px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px}
.mute{color:var(--mute)}small{font-size:12px}
.btn{font:600 15px Inter;border:0;border-radius:12px;padding:12px 16px;background:var(--teal);color:#06231f;cursor:pointer}
.btn.gold{background:var(--gold);color:#2a2000}.btn.ghost{background:var(--panel2);color:var(--text);border:1px solid var(--line)}.btn.danger{background:var(--red);color:#fff}.btn.block{width:100%;display:block}.btn.sm{padding:8px 12px;font-size:13px;border-radius:10px}
.icon-btn{background:var(--panel2);border:1px solid var(--line);color:var(--text);width:36px;height:36px;border-radius:10px;font-size:15px;flex:none;cursor:pointer}
.icon-btn.sm{width:30px;height:30px;font-size:12px;border-radius:8px}
input,select{font:16px Inter;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%;outline:none}
input:focus{border-color:var(--teal)}
label.lbl{display:block;font:600 12px Inter;color:var(--mute);letter-spacing:.06em;text-transform:uppercase;margin:14px 0 6px}
.row{display:flex;align-items:center}.gap{gap:10px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
.bar{height:8px;border-radius:99px;background:var(--panel2);overflow:hidden}.bar>i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,var(--teal),var(--gold));transition:width .6s}
.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;background:rgba(17,16,27,.96);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border-top:1px solid var(--line);padding:8px 4px calc(8px + env(safe-area-inset-bottom));z-index:6}
.tabs button{background:none;border:0;color:var(--mute);display:flex;flex-direction:column;align-items:center;gap:3px;font:600 11px Inter;flex:1;cursor:pointer}
.tabs button.on{color:var(--teal)}.tabs svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
svg.body{width:100%;display:block}
svg.body .base{fill:var(--base)}
svg.body .mus{stroke:var(--panel);stroke-width:1.6;transition:fill .5s}
svg.body.tap .mus{cursor:pointer}
svg.body.tap .mus:active{opacity:.75}
svg.body text{fill:var(--mute);font:600 11px 'Chakra Petch';letter-spacing:.25em;text-anchor:middle}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}
.chips.wrap{flex-wrap:wrap;overflow:visible}
.chip{flex:none;background:var(--panel2);border:1px solid var(--line);color:var(--text);border-radius:99px;padding:8px 13px;font:500 13px Inter;cursor:pointer}
.chip.on{background:var(--teal);color:#06231f;border-color:var(--teal)}
.chip.gold.on{background:var(--gold);border-color:var(--gold);color:#2a2000}
.player{display:flex;gap:14px;align-items:center;background:linear-gradient(135deg,#1b1930,#15141f 60%);position:relative;overflow:hidden}
.player:after{content:"";position:absolute;right:-40px;top:-40px;width:140px;height:140px;border-radius:50%;background:radial-gradient(var(--teal),transparent 70%);opacity:.15}
.lvl-badge{width:64px;height:64px;flex:none;border-radius:16px;display:flex;flex-direction:column;align-items:center;justify-content:center;background:var(--panel2);border:2px solid var(--gold);box-shadow:0 0 18px rgba(242,201,76,.25);font-family:'Chakra Petch'}
.lvl-badge small{font-size:10px;color:var(--gold);letter-spacing:.2em}.lvl-badge b{font-size:26px;line-height:1}
.title-tag{font:600 11px 'Chakra Petch';letter-spacing:.12em;color:var(--gold);text-transform:uppercase}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:14px}
.stat{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.stat b{display:block;font:700 22px 'Chakra Petch'}.stat small{color:var(--mute)}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;justify-content:center;margin-top:8px}
.legend span{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--mute)}.legend i{width:10px;height:10px;border-radius:3px;display:inline-block}
.mrow{display:grid;grid-template-columns:118px 1fr 48px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.mrow:last-child{border-bottom:0}
.mrow .nm{font-weight:600;font-size:14px;display:flex;align-items:center;gap:6px}.mrow .nm i{width:8px;height:8px;border-radius:50%}
.mrow .lv{font:700 13px 'Chakra Petch';text-align:right}
.wrow{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer}.wrow:last-child{border-bottom:0}
.xp{font:700 14px 'Chakra Petch';color:var(--gold)}
.ex-head{display:flex;gap:10px;align-items:center;margin-bottom:8px}
.thumb{width:64px;flex:none;background:var(--panel2);border-radius:10px;padding:4px}
.thumb svg .mus{stroke:var(--panel2)}
.ex-head .info{flex:1;min-width:0}.ex-head b{display:block;font-size:15px}
.set-row{display:grid;grid-template-columns:30px 62px 1fr 1fr 30px;gap:8px;align-items:center;margin-bottom:6px}
.set-row.hdr{font:600 10px Inter;color:var(--mute);letter-spacing:.08em}
.set-row .n{font:700 14px 'Chakra Petch';text-align:center;color:var(--teal)}
.set-row .prev{font-size:12px;color:var(--mute);text-align:center}
.set-row input{padding:9px;text-align:center}
.live{border-color:rgba(79,209,197,.4)}
.pulse{color:var(--teal);font:700 12px 'Chakra Petch';letter-spacing:.15em;animation:pl 1.6s infinite}@keyframes pl{50%{opacity:.4}}
#elapsed{font:700 18px 'Chakra Petch'}
.day-btns{display:flex;flex-wrap:wrap;gap:8px;margin-top:8px}
.lib-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:10px;cursor:pointer}
.lcard .mini{background:var(--panel2);border-radius:10px;padding:6px 4px;margin-bottom:8px}
.lcard .mini svg .mus{stroke:var(--panel2)}
.lcard b{display:block;font-size:13px;line-height:1.25}.lcard small{color:var(--mute)}
.tag{display:inline-block;font:600 11px Inter;padding:4px 8px;border-radius:6px;background:var(--panel2);color:var(--mute);margin:0 6px 6px 0}
.tag.p{background:rgba(242,201,76,.15);color:var(--gold)}.tag.s{background:rgba(79,209,197,.15);color:var(--teal)}
.cues{padding-left:20px;margin:0 0 12px;line-height:1.6}
.item-row{display:grid;grid-template-columns:1fr 42px 10px 52px 30px 30px;gap:6px;align-items:center;margin-bottom:6px;font-size:14px}
.item-row input{padding:8px 4px;text-align:center}
.item-row .x{color:var(--mute);text-align:center}
.prow{display:flex;justify-content:space-between;gap:10px;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;cursor:pointer}.prow:last-child{border-bottom:0}
.prow .sr{font:600 13px 'Chakra Petch';color:var(--teal);white-space:nowrap}
.ftag{font:600 10px Inter;color:var(--gold);border:1px solid var(--gold);border-radius:5px;padding:1px 5px;margin-left:6px}
.notes{margin:0;padding-left:18px;line-height:1.55;font-size:14px;color:#cfcde0}
.sheet-wrap{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:flex-end;justify-content:center;z-index:20}
.sheet-wrap.open{display:flex}
.sheet{width:100%;max-width:560px;max-height:90vh;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--panel);border-radius:20px 20px 0 0;border:1px solid var(--line);padding:18px 16px calc(20px + env(safe-area-inset-bottom));animation:up .25s ease}
@keyframes up{from{transform:translateY(40px);opacity:0}}
.prow-pick{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line);cursor:pointer}
.prow-pick .thumb{width:58px}
.reward{text-align:center}
.reward .big{font:700 46px 'Chakra Petch';color:var(--gold);text-shadow:0 0 24px rgba(242,201,76,.45);animation:pop .6s cubic-bezier(.2,1.6,.4,1)}
@keyframes pop{from{transform:scale(.4);opacity:0}}
.lvup{display:inline-block;font:700 10px 'Chakra Petch';letter-spacing:.12em;background:var(--gold);color:#2a2000;border-radius:5px;padding:2px 6px;margin-left:6px;animation:pop .6s .3s both}
.rrow{display:grid;grid-template-columns:1fr auto;gap:4px 10px;text-align:left;padding:8px 0;border-bottom:1px solid var(--line)}
.rrow .bar{grid-column:1/3}
.banner{background:linear-gradient(90deg,var(--purple),var(--teal));color:#0b0a12;font:700 14px 'Chakra Petch';letter-spacing:.1em;border-radius:10px;padding:10px;margin:10px 0}
.empty{text-align:center;padding:24px 10px}
#toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:var(--panel2);border:1px solid var(--line);padding:10px 16px;border-radius:12px;font-size:14px;opacity:0;transition:.25s;z-index:30;pointer-events:none;white-space:nowrap}
#toast.show{opacity:1;transform:translateX(-50%)}
.spark{width:100%;height:60px;display:block;margin:6px 0 12px}
.hint{font-size:12px;color:var(--teal);background:rgba(79,209,197,.08);border:1px solid rgba(79,209,197,.25);border-radius:8px;padding:6px 9px;margin:0 0 10px}
.card.ss{border-left:3px solid var(--purple)}
.ss-tag{font:700 10px 'Chakra Petch';letter-spacing:.14em;color:var(--purple);margin-bottom:6px}
.sstag{font:600 10px Inter;color:var(--purple);border:1px solid var(--purple);border-radius:5px;padding:1px 5px;margin-left:6px}
.icon-btn.on{background:var(--purple);border-color:var(--purple);color:#0b0a12}
.ex-actions{display:flex;gap:8px;flex-wrap:wrap}
.quest{padding:10px 0;border-bottom:1px solid var(--line)}.quest:last-child{border-bottom:0}
.quest .bar{margin:6px 0 4px}.quest.done{opacity:.55}
.qscope{font:700 10px 'Chakra Petch';letter-spacing:.14em;color:var(--purple);text-transform:uppercase}
.trow{display:flex;gap:8px;margin-top:10px;font-size:22px;flex-wrap:wrap}
.trow span{width:40px;height:40px;display:grid;place-items:center;background:var(--panel2);border-radius:10px}
.trow span.locked{opacity:.3;filter:grayscale(1)}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.badge{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:10px 6px;text-align:center;display:flex;flex-direction:column;gap:3px}
.badge .bi{font-size:28px}.badge b{font-size:12px}.badge small{font-size:10px;color:var(--mute);line-height:1.3}
.badge.locked{opacity:.4}.badge.locked .bi{filter:grayscale(1)}
.bwchart{width:100%;display:block;margin-top:8px}.bwchart .ax{fill:var(--mute);font:500 10px Inter}
.pr-box{background:linear-gradient(135deg,rgba(242,201,76,.18),rgba(167,139,250,.12));border:1px solid rgba(242,201,76,.5);border-radius:12px;padding:10px 12px;margin:12px 0;text-align:left}
.pr-box h4{margin:0 0 6px;font:700 14px 'Chakra Petch';letter-spacing:.12em;color:var(--gold);text-align:center;animation:pop .6s .2s both}
.pr-box.q{background:rgba(167,139,250,.1);border-color:rgba(167,139,250,.45)}.pr-box.q h4{color:var(--purple)}
.mini-row{display:flex;justify-content:space-between;gap:10px;font-size:13px;padding:3px 0}
.reward{position:relative;overflow:hidden}
.confetti{position:absolute;inset:0;pointer-events:none;z-index:2}
.confetti i{position:absolute;top:-14px;width:7px;height:12px;border-radius:2px;animation:fall 2.4s ease-in forwards}
@keyframes fall{to{transform:translateY(620px) rotate(640deg);opacity:0}}
.decay-tag{font:600 9px Inter;letter-spacing:.04em;color:var(--mute);border:1px solid var(--line);border-radius:4px;padding:0 4px}
.thumb.photo,.mini.photo{padding:0;overflow:hidden;background:#fff}
.thumb.photo img{display:block;width:100%;height:48px;object-fit:cover}
.mini.photo img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:4px 0 12px}
.photos figure{margin:0;background:#fff;border-radius:12px;overflow:hidden;position:relative}
.photos img{display:block;width:100%;aspect-ratio:4/3;object-fit:cover}
.photos figcaption{position:absolute;left:6px;bottom:6px;font:700 10px 'Chakra Petch';letter-spacing:.12em;background:rgba(11,10,18,.8);color:var(--text);padding:2px 6px;border-radius:5px;text-transform:uppercase}
details.steps{margin:0 0 12px}details.steps summary{cursor:pointer;color:var(--teal);font-weight:600;font-size:14px;margin-bottom:8px}
.macros{display:grid;gap:10px;margin-top:12px}
.msplit{display:flex;height:10px;border-radius:99px;overflow:hidden;gap:2px;margin:10px 0 6px;background:var(--panel2)}
.msplit i{display:block;height:100%}
.mlegend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--mute)}
.mlegend span{display:flex;align-items:center;gap:5px}.mlegend i{width:8px;height:8px;border-radius:2px;display:inline-block}
.frow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.frow:last-of-type{border-bottom:0}
.fk{text-align:right;white-space:nowrap;font:700 15px 'Chakra Petch'}.fk small{font:500 11px Inter}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:0 10px}
.mrow3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;text-align:center}
.mrow3 div{background:var(--panel2);border-radius:10px;padding:8px}.mrow3 small{display:block}.mrow3 b{font:700 16px 'Chakra Petch'}
select{font:16px Inter;background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:10px;padding:10px;width:100%}
.scanbox{position:relative;border-radius:14px;overflow:hidden;background:#000;aspect-ratio:4/3;margin-bottom:10px}
.scanbox video{width:100%;height:100%;object-fit:cover;display:block}
.scanline{position:absolute;left:10%;right:10%;top:50%;height:2px;background:var(--red);box-shadow:0 0 12px var(--red);animation:scan 1.8s ease-in-out infinite}
@keyframes scan{0%,100%{transform:translateY(-60px)}50%{transform:translateY(60px)}}
#updBar{position:fixed;left:12px;right:12px;top:calc(62px + env(safe-area-inset-top));z-index:40;display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--panel2);border:1px solid var(--gold);border-radius:14px;padding:10px 12px;font-size:14px;box-shadow:0 8px 30px rgba(0,0,0,.5);max-width:536px;margin:0 auto}
:root{--water:#5fa8f5}
.btn.water{background:var(--water);color:#06182b}
.drops{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0}
.drops .cup{width:16px;height:22px;display:block}
.water-card{padding:12px 14px}
.water-card .drops{gap:3px;margin:0}
.water-row{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px;flex-wrap:wrap}
.wamt{font:700 16px 'Chakra Petch'}.wamt small{font:500 12px Inter}
.btn.xs{padding:6px 10px;font-size:13px;border-radius:9px}
.lbrow{display:grid;grid-template-columns:32px 1fr auto;gap:8px;align-items:center;padding:9px 6px;border-bottom:1px solid var(--line);font-size:14px}
.lbrow:last-of-type{border-bottom:0}.lbrow.me{background:rgba(79,209,197,.08);border-radius:10px}
.lbrank{font:700 15px 'Chakra Petch';text-align:center}.lbval{font:700 14px 'Chakra Petch';color:var(--gold)}
.fcode{font:700 34px 'Chakra Petch';letter-spacing:.25em;text-align:center;background:var(--panel2);border:1px dashed var(--teal);border-radius:12px;padding:12px;margin-bottom:10px;color:var(--teal)}
:root[data-theme="royal"]{--teal:#a78bfa;--gold:#f2c94c;--bg:#0e0a18;--panel:#17122a;--panel2:#211a38;--line:#2f2650}
:root[data-theme="crimson"]{--teal:#f2667a;--gold:#f2c94c;--bg:#120a0c;--panel:#1c1215;--panel2:#26181c;--line:#3a2328}
:root[data-theme="arctic"]{--teal:#7dd3fc;--gold:#e0f2fe;--bg:#08111a;--panel:#0f1b27;--panel2:#162636;--line:#22384d}
:root[data-theme="emerald"]{--teal:#34d399;--gold:#fbbf24;--bg:#07120e;--panel:#0e1c17;--panel2:#152920;--line:#1f3a2e}
:root[data-theme="gold"]{--teal:#f2c94c;--gold:#fff1b8;--bg:#0a0a0a;--panel:#141414;--panel2:#1d1d1d;--line:#2b2b2b}
:root[data-theme="inferno"]{--teal:#fb923c;--gold:#facc15;--bg:#140a05;--panel:#1e110a;--panel2:#2a170d;--line:#3d2213}
:root[data-theme="diamond"]{--teal:#a5f3fc;--gold:#e9d5ff;--bg:#0b0d18;--panel:#131728;--panel2:#1b2036;--line:#2a3150}
.top{background:color-mix(in srgb,var(--bg) 88%,transparent)!important}
.tabs{background:color-mix(in srgb,var(--panel) 96%,transparent)!important}
.player{background:linear-gradient(135deg,color-mix(in srgb,var(--teal) 9%,var(--panel)),var(--panel) 60%)!important}
.logo{background:linear-gradient(135deg,var(--teal),var(--gold))}
.title-tag.eq{cursor:pointer}
.themes{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.theme-tile{background:var(--p);border:2px solid var(--line);border-radius:12px;padding:10px;text-align:left;color:#eeedf7;display:flex;flex-direction:column;gap:3px;cursor:pointer;font:inherit}
.theme-tile.on{border-color:var(--a);box-shadow:0 0 0 1px var(--a) inset}
.theme-tile.locked{opacity:.5}
.theme-tile .sw{display:flex;gap:4px;margin-bottom:4px}.theme-tile .sw i{width:16px;height:16px;border-radius:50%;background:var(--a)}.theme-tile .sw i+i{background:var(--b)}
.theme-tile b{font-size:13px}.theme-tile small{font-size:11px;color:#a9a6c2}
.chip.locked{opacity:.5}.chip small{font-size:10px;opacity:.8}
svg.body .aura{opacity:.55;animation:auraP 2.6s ease-in-out infinite}
svg.body .aura.flame{animation:flick .5s ease-in-out infinite alternate}
@keyframes auraP{50%{opacity:.9}}@keyframes flick{from{opacity:.45}to{opacity:.95}}
.lvlup-overlay{position:fixed;inset:0;z-index:60;background:color-mix(in srgb,var(--bg) 92%,transparent);display:flex;align-items:center;justify-content:center;overflow:hidden;animation:fadeIn .3s}
.lvlup-overlay.out{animation:fadeOut .3s forwards}
@keyframes fadeIn{from{opacity:0}}@keyframes fadeOut{to{opacity:0}}
.lvlup-rays{position:absolute;width:160vmax;height:160vmax;background:repeating-conic-gradient(from 0deg,color-mix(in srgb,var(--gold) 16%,transparent) 0 8deg,transparent 8deg 24deg);animation:spin 18s linear infinite;mask:radial-gradient(circle,#000 10%,transparent 60%);-webkit-mask:radial-gradient(circle,#000 10%,transparent 60%)}
@keyframes spin{to{transform:rotate(360deg)}}
.lvlup-inner{position:relative;text-align:center;width:min(340px,86vw)}
.lvlup-kicker{font:700 16px 'Chakra Petch';letter-spacing:.4em;color:var(--teal);animation:pop .5s both}

.loot .chest{width:64px;flex:none;position:relative;z-index:1}

.loot-text{display:flex;flex-direction:column;gap:2px;position:relative;z-index:1}.loot-text small{color:var(--mute);font-size:12px}

.loot.opening .chest{animation:shake .15s linear infinite}

.loot.open .chest .lid{transform:translate(-4px,-12px) rotate(-18deg)}
.loot.open .loot-text{display:none}.loot.open .loot-prize{display:flex;animation:pop .5s cubic-bezier(.2,1.6,.4,1)}
.loot.open .loot-burst{animation:burst .9s ease-out forwards}

/* ============ XP MATH ============ */
const effW = (ex, s) => (+s.w || 0) + (ex.bw ? state.profile.bw * ex.bw : 0);
function workoutXP(w){
  const xp = {};
  for (const e of w.entries){
    const ex = EX[e.ex]; if (!ex || ex.nx) continue;
    const base = e.sets.reduce((a,s) => a + effW(ex,s) * (+s.r||0), 0) / 10;
    ex.p.forEach(m => xp[m] = (xp[m]||0) + base);
    ex.s.forEach(m => xp[m] = (xp[m]||0) + base * .5);
  }
  for (const k in xp) xp[k] = Math.round(xp[k]);
  return xp;
}
function muscleTotals(){
  const t = {}; for (const m in MUSCLES) t[m] = 0;
  for (const w of state.workouts) for (const m in w.xp) t[m] = (t[m]||0) + w.xp[m];
  return t;
}
const sumObj = o => Object.values(o).reduce((a,b) => a+b, 0);
const playerLvl = total => Math.floor(Math.sqrt(total / 1000));
function weekKey(ts){ const d = new Date(ts); d.setHours(0,0,0,0); d.setDate(d.getDate() - ((d.getDay()+6)%7)); return d.getTime(); }
function weekStreak(){
  const weeks = new Set(state.workouts.map(w => weekKey(w.date)));
  let k = weekKey(Date.now()), n = 0;
  if (!weeks.has(k)) k -= 7*864e5;
  while (weeks.has(k)) { n++; k = weekKey(k - 3*864e5); }
  return n;
}
function lastSets(exId){
  for (const w of state.workouts){ const e = w.entries.find(e => e.ex === exId); if (e) return e.sets; }
  return null;
}
function exStats(id){
  const ex = EX[id]; let count = 0, best = null; const pts = [];
  for (const w of [...state.workouts].reverse()){
    const e = w.entries.find(e => e.ex === id); if (!e) continue;
    count++; let sBest = 0;
    for (const s of e.sets){ const W = effW(ex,s), rm = W * (1 + s.r/30); if (rm > sBest) sBest = rm; if (!best || rm > best.rm) best = {w:s.w, r:s.r, rm}; }
    pts.push(sBest);
  }
  return {count, best, pts};
}
const dstr = ts => new Date(ts).toLocaleDateString(undefined, {weekday:'short', month:'short', day:'numeric'});

/* ============ FEATURES: PRs, hints, decay, quests, achievements, plates, bodyweight ============ */
const DAY = 864e5;
const LOWER = ['quads','hamstrings','glutes','calves'];
const e1rm = (ex, s) => effW(ex, s) * (1 + (+s.r || 0) / 30);
const wVol = w => w.vol ?? w.entries.reduce((a, e) => { const ex = EX[e.ex]; return ex ? a + e.sets.reduce((b, s) => b + effW(ex, s) * s.r, 0) : a; }, 0);
function bestBefore(exId, ts = Infinity){
  const ex = EX[exId]; let rm = 0, seen = false;
  for (const w of state.workouts){ if (w.date >= ts) continue; const e = w.entries.find(e => e.ex === exId); if (!e) continue; seen = true; for (const s of e.sets) rm = Math.max(rm, e1rm(ex, s)); }
  return seen ? rm : null;
}
// Progressive overload: look at last session and suggest the next small step
function overloadHint(e){
  const ex = EX[e.ex], last = lastSets(e.ex);
  if (ex.nx) return `${CATS[ex.cat]} — logged for tracking, earns no XP`;
  if (!last || !last.length) return 'First time — pick a weight you can control for every rep';
  const m = String(e.target || '').match(/×\s*(\d+)(?:\s*-\s*(\d+))?/);
  const hi = m ? +(m[2] || m[1]) : 12;
  const maxW = Math.max(...last.map(s => +s.w || 0));
  const reps = last.filter(s => (+s.w || 0) === maxW).map(s => s.r);
  if (ex.bw && !maxW) return `Last: ${reps.join('/')} reps — aim for ${Math.max(...reps) + 1}`;
  const inc = ex.p.some(x => LOWER.includes(x)) ? 10 : 5;
  if (reps.every(r => r >= hi)) return `Top of range hit — try ${maxW + inc} lb`;
  return `Last: ${maxW}×${reps.join('/')} — aim for ${maxW}×${Math.min(...reps) + 1}`;
}
// Muscle decay: fades on the map after 7 days, "Rusty" after 14
function lastHit(){ const l = {}; for (const w of state.workouts) for (const m in w.xp) if (w.xp[m] > 0 && !(l[m] > w.date)) l[m] = w.date; return l; }
function decayOf(ts){ if (!ts) return {op:1, tag:''}; const d = (Date.now() - ts) / DAY; return d <= 7 ? {op:1, tag:''} : d <= 14 ? {op:.6, tag:'Cooling'} : {op:.35, tag:'Rusty'}; }
// Supersets: an entry with ss=true is linked to the next one
function ssLabels(list){ const out = []; let n = 0, i = 0; while (i < list.length){ let j = i; while (j < list.length - 1 && list[j].ss) j++; if (j > i){ const L = 'ABCDEFGH'[n++ % 8]; for (let k = i; k <= j; k++) out[k] = L; } i = j + 1; } return out; }

/* ---- Quests ---- */
const dayKey = ts => { const d = new Date(ts); d.setHours(0,0,0,0); return d.getTime(); };
function rng(seed){ let x = (Math.abs(Math.floor(seed)) % 2147483646) + 1; return () => (x = x * 16807 % 2147483647) / 2147483647; }
function totalsBefore(ts){ const t = {}; for (const m in MUSCLES) t[m] = 0; for (const w of state.workouts) if (w.date < ts) for (const m in w.xp) t[m] += w.xp[m]; return t; }
function questList(){
  const now = Date.now(), dk = dayKey(now), wk = weekKey(now), ms = Object.keys(MUSCLES);
  const rd = rng(dk / DAY), rw = rng(wk / DAY * 7 + 3), pick = (a, f) => a[Math.floor(f() * a.length)];
  const dOpts = [{t:'sets', m:pick(ms, rd), n:8}, {t:'workouts', n:1}, {t:'vol', n:5000}];
  const daily = dOpts[Math.floor(rd() * dOpts.length)];
  const tb = totalsBefore(wk), weak = ms.slice().sort((a, b) => tb[a] - tb[b])[0];
  const extra = [{t:'vol', n:30000}, {t:'hits', m:pick(ms, rw), n:2}, {t:'pr', n:1}][Math.floor(rw() * 3)];
  const qs = [
    {...daily, id:'d' + dk, scope:'Daily', start:dk, xp:150},
    {t:'sets', m:weak, n:15, id:'w' + wk + 'a', scope:'Weekly', start:wk, xp:500, weak:true},
    {t:'workouts', n:3, id:'w' + wk + 'b', scope:'Weekly', start:wk, xp:400},
    {...extra, id:'w' + wk + 'c', scope:'Weekly', start:wk, xp:400}
  ];
  for (const q of qs){ q.prog = questProgress(q); q.done = !!state.questsDone[q.id]; q.title = questTitle(q); }
  return qs;
}
function questProgress(q){
  const ws = state.workouts.filter(w => w.date >= q.start);
  if (q.t === 'workouts') return ws.length;
  if (q.t === 'vol') return Math.round(ws.reduce((a, w) => a + wVol(w), 0));
  if (q.t === 'pr') return ws.reduce((a, w) => a + (w.prs ? w.prs.length : 0), 0);
  if (q.t === 'hits') return new Set(ws.filter(w => w.entries.some(e => EX[e.ex]?.p.includes(q.m))).map(w => dayKey(w.date))).size;
  return ws.reduce((a, w) => a + w.entries.reduce((b, e) => b + (EX[e.ex]?.p.includes(q.m) ? e.sets.length : 0), 0), 0);
}
function questTitle(q){
  const when = q.scope === 'Daily' ? 'today' : 'this week';
  return {sets:`Log ${q.n} sets of ${MUSCLES[q.m]} ${when}`, workouts: q.n === 1 ? 'Finish a workout today' : `Train ${q.n} times this week`,
    vol:`Move ${fmt(q.n)} lb ${when}`, hits:`Hit ${MUSCLES[q.m]} on ${q.n} different days`, pr:'Set a new PR this week'}[q.t];
}

/* ---- Plate calculator ---- */
const PLATES = [[45,'#f2667a',92],[35,'#f2c94c',82],[25,'#4fd1c5',72],[10,'#a78bfa',56],[5,'#b8c4d6',44],[2.5,'#c98a5b',36]];
function plateMath(total, bar){ let side = (total - bar) / 2; const out = []; if (side < 0) return {out, rem:0, under:true}; for (const [p] of PLATES) while (side >= p - 1e-9){ out.push(p); side -= p; } return {out, rem: Math.round(side * 2 * 100) / 100}; }
function plateViz(total, bar){
  if (!total) return '<p class="mute">Enter a weight.</p>';
  const {out, rem, under} = plateMath(total, bar);
  if (under) return `<p class="mute">That's lighter than the ${bar} lb bar.</p>`;
  let x = 62, svg = '';
  for (const p of out){ const [, c, h] = PLATES.find(q => q[0] === p); svg += `<rect x="${x}" y="${60 - h/2}" width="13" height="${h}" rx="3" fill="${c}"/>`; x += 15; }
  return `<svg viewBox="0 0 300 120" style="width:100%;display:block"><rect x="4" y="55" width="292" height="10" rx="4" fill="#8e8aa8"/><rect x="50" y="44" width="9" height="32" rx="2" fill="#b8c4d6"/>${svg}</svg>
    <p style="margin:6px 0 0;text-align:center"><b>Each side:</b> ${out.length ? out.join(' + ') : 'just the bar'}${rem ? `<br><small class="mute">${rem} lb left over — can't be made with standard plates</small>` : ''}</p>`;
}
function openPlates(w){

  openSheet(`<div class="row between"><h3 style="margin:0">Plate calculator</h3><button class="icon-btn" data-act="closeSheet">✕</button></div>

    <label class="lbl">Bar</label><div class="chips" id="barChips">${[45,35,15].map(b => `<button class="chip${ui.plateBar === b ? ' on' : ''}" data-act="plateBar" data-v="${b}">${b} lb</button>`).join('')}</div>
    <div id="plateViz" style="margin-top:14px">${plateViz(+w || 0, ui.plateBar)}</div>`);
}

/* ---- Bodyweight ---- */
function bwChart(log){
  if (log.length < 2) return log.length ? '<p class="mute" style="font-size:13px">Log another weigh-in to see your trend.</p>' : '';
  const W = 320, H = 120, pl = 30, pr = 8, pt = 10, pb = 20;
  const ys = log.map(l => l.w); let mn = Math.min(...ys), mx = Math.max(...ys);
  if (mx - mn < 4){ const c = (mx + mn) / 2; mn = c - 2; mx = c + 2; } const pad = (mx - mn) * .15; mn -= pad; mx += pad;
  const x0 = log[0].date, x1 = log[log.length - 1].date;
  const X = t => pl + (x1 === x0 ? 0 : (t - x0) / (x1 - x0)) * (W - pl - pr), Y = v => pt + (1 - (v - mn) / (mx - mn)) * (H - pt - pb);
  const grid = [mn + (mx - mn) * .25, mn + (mx - mn) * .75].map(v => `<line x1="${pl}" x2="${W - pr}" y1="${Y(v).toFixed(1)}" y2="${Y(v).toFixed(1)}" stroke="var(--line)" stroke-width="1"/><text x="${pl - 5}" y="${(Y(v) + 3).toFixed(1)}" text-anchor="end" class="ax">${Math.round(v)}</text>`).join('');
  const pts = log.map(l => `${X(l.date).toFixed(1)},${Y(l.w).toFixed(1)}`).join(' ');
  const dots = log.map((l, i) => `<circle cx="${X(l.date).toFixed(1)}" cy="${Y(l.w).toFixed(1)}" r="${i === log.length - 1 ? 4.5 : 3}" fill="${TEAL}" stroke="var(--panel)" stroke-width="2"/><circle cx="${X(l.date).toFixed(1)}" cy="${Y(l.w).toFixed(1)}" r="13" fill="transparent" data-act="bwTip" data-i="${i}"/>`).join('');
  const d = ts => new Date(ts).toLocaleDateString(undefined, {month:'short', day:'numeric'});
  return `<svg viewBox="0 0 ${W} ${H}" class="bwchart">${grid}<polyline points="${pts}" fill="none" stroke="${TEAL}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>${dots}<text x="${pl}" y="${H - 4}" class="ax">${d(x0)}</text><text x="${W - pr}" y="${H - 4}" text-anchor="end" class="ax">${d(x1)}</text></svg>`;
}
function bwCard(){
  const log = state.bwLog, last = log[log.length - 1];
  const ref = log.filter(l => l.date <= Date.now() - 30 * DAY).pop() || log[0];
  const delta = last && ref && ref !== last ? last.w - ref.w : null;
  return `<div class="card"><div class="row between"><h3 style="margin:0">Bodyweight</h3>${last ? `<span><b style="font:700 20px 'Chakra Petch'">${last.w}</b> <small class="mute">lb</small></span>` : ''}</div>
    ${delta !== null ? `<small class="mute">${delta > 0 ? '+' : ''}${delta.toFixed(1)} lb since ${dstr(ref.date)}</small>` : ''}
    ${bwChart(log.slice(-60))}<div id="bwTip" class="mute" style="font-size:12px;min-height:16px;text-align:center"></div>
    <div class="row gap"><input id="bwIn" type="number" inputmode="decimal" placeholder="Today's weight (lb)"><button class="btn sm" data-act="bwLog">Log</button></div>
    ${log.length ? `<button class="btn ghost sm" style="margin-top:8px" data-act="bwHistory">History</button>` : ''}</div>`;
}
function openBwHistory(){
  openSheet(`<div class="row between"><h3 style="margin:0">Weigh-ins</h3><button class="icon-btn" data-act="closeSheet">✕</button></div>
    ${[...state.bwLog].reverse().map(l => `<div class="prow"><span>${dstr(l.date)}</span><span class="row gap"><b>${l.w} lb</b><button class="icon-btn sm" data-act="bwDel" data-d="${l.date}">✕</button></span></div>`).join('') || '<p class="mute">No weigh-ins yet.</p>'}`);
}

function livePR(i, j){
  const e = state.active.entries[i], ex = EX[e.ex], s = e.sets[j], pb = bestBefore(e.ex);
  const n = document.querySelector(`[data-row="${i}-${j}"] .n`); if (!n) return;
  const isPR = pb !== null && +s.r > 0 && e1rm(ex, s) > pb + .01;
  if (isPR && n.textContent !== '🏆') toast('🏆 PR pace! Finish to lock it in');
  n.textContent = isPR ? '🏆' : j + 1;
}

    const offCache = {};

function calcTargets(fp){
  const lb = +fp.lb, kg = lb * 0.4536, cm = ((+fp.ft) * 12 + (+fp.inch)) * 2.54, age = +fp.age;
  if (!(lb > 50 && cm > 100 && age >= 13)) return null;
  const bmr = 10 * kg + 6.25 * cm - 5 * age + (fp.sex === 'f' ? -161 : 5);
  const goal = GOALS.find(g => g[0] === fp.goal) || GOALS[1];
  const kcal = Math.max(fp.sex === 'f' ? 1200 : 1500, Math.round(bmr * fp.act * goal[2] / 10) * 10);
  const p = Math.round(lb * goal[3]), f = Math.round(kcal * 0.27 / 9), c = Math.max(0, Math.round((kcal - p * 4 - f * 9) / 4));
  return {kcal, p, c, f};
}

  const t = state.foodTargets || calcTargets(fp) || {kcal:'', p:'', c:'', f:''};
  const chip = (k, v, l) => `<button class="chip${String(fp[k]) === String(v) ? ' on' : ''}" data-act="tpSet" data-k="${k}" data-v="${v}">${l}</button>`;

const GLASS = 8; // oz per tap
// Tapered drinking glass, filled from the bottom (fill 0..1)
function cupSVG(fill, i){
  const W = '#5fa8f5', top = 3, bot = 24, h = bot - top, y = bot - h * fill;
  const glass = 'M2.5,3 L17.5,3 L15.6,23 Q15.4,24.5 13.8,24.5 L6.2,24.5 Q4.6,24.5 4.4,23 Z';
  return `<svg class="cup" viewBox="0 0 20 27" aria-hidden="true"><defs><clipPath id="cupc${i}"><path d="${glass}"/></clipPath></defs>`
    + (fill > 0 ? `<rect x="0" y="${y.toFixed(1)}" width="20" height="${(27 - y).toFixed(1)}" fill="${W}" clip-path="url(#cupc${i})"/>` + (fill < 1 ? `<path d="M3,${y.toFixed(1)} q2.5,-1.4 5,0 t5,0 t5,0" fill="none" stroke="#9fcbff" stroke-width=".8" clip-path="url(#cupc${i})"/>` : '') : '')
    + `<path d="${glass}" fill="none" stroke="${W}" stroke-width="1.6" stroke-linejoin="round"/>`
    + `<path d="M5,6 L6.2,19" stroke="#fff" stroke-opacity=".25" stroke-width="1.2" stroke-linecap="round"/></svg>`;
}
function waterCard(){

async function ensureFirebase(){
  if (!FIREBASE_CONFIG) throw new Error('Firebase not configured');
  if (!window.firebase){
    await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js');
    await loadScript('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js');
  }
  if (!firebase.apps.length) firebase.initializeApp(FIREBASE_CONFIG);
  return firebase.firestore();
}
function myStats(){
  const total = sumObj(muscleTotals()) + state.bonusXP;
  return {name: state.profile.name || 'Lifter', title: myTitle(playerLvl(total)), level: playerLvl(total), xp: Math.round(total), streak: weekStreak(),
    week: state.workouts.filter(w => w.date > Date.now() - 7 * DAY).length, workouts: state.workouts.length,
    trophies: Object.keys(state.achievements).length, updatedAt: Date.now()};
}
let lastPublish = 0;
async function publishStats(force){
  if (!FIREBASE_CONFIG || (!force && Date.now() - lastPublish < 5 * 60e3)) return;
  lastPublish = Date.now();
  try { const db = await ensureFirebase(); await db.collection('gymdom_players').doc(state.profile.playerId).set(myStats(), {merge:true}); }
  catch(e){ ui.lbErr = 'Leaderboard unavailable: ' + (e.message || e); }
}
// Friend requests: adding someone leaves your code in their card's "followers" list.
// On launch we read our own followers; anyone who isn't already a friend shows up as a request to accept or ignore.
const FV = () => firebase.firestore.FieldValue;
let followSynced = false;
async function syncFollowers(){
  if (!FIREBASE_CONFIG) return [];
  const db = await ensureFirebase(), me = state.profile.playerId, col = db.collection('gymdom_players');
  if (!followSynced){ followSynced = true;  // let everyone we've added know (covers friends added before requests existed)
    await Promise.all(state.friends.map(id => col.doc(id).set({followers: FV().arrayUnion(me)}, {merge:true}).catch(() => {}))); }
  const mine = await col.doc(me).get(), followers = (mine.exists && mine.data().followers) || [];
  const pending = followers.filter(id => id && id !== me && !state.friends.includes(id) && !(state.friendsRemoved || []).includes(id));
  const docs = await Promise.all(pending.map(id => col.doc(id).get().then(d => d.exists ? {id, ...d.data()} : null).catch(() => null)));
  const reqs = docs.filter(Boolean), seen = state.reqSeen || [], fresh = reqs.filter(r => !seen.includes(r.id));
  ui.friendReqs = reqs;
  if (fresh.length){
    state.reqSeen = [...new Set([...seen, ...fresh.map(r => r.id)])]; saveLocal();
    toast(fresh.length === 1 ? `${fresh[0].name} sent you a friend request` : `${fresh.length} new friend requests`);
  }
  if (ui.tab === 'progress' && !document.querySelector('#sheetWrap.open')) render();
  return reqs;
}
const reqRows = () => (ui.friendReqs || []).map(r => `<div class="req"><span>🤝 <b>${esc(r.name)}</b> <small class="mute">Lv ${r.level ?? 0}</small><br><small class="mute">wants to be friends</small></span>
  <span class="row gap"><button class="btn ghost xs" data-act="ignoreReq" data-id="${r.id}">Ignore</button><button class="btn xs" data-act="acceptReq" data-id="${r.id}">Accept</button></span></div>`).join('');
async function loadLeaderboard(){
  if (!FIREBASE_CONFIG || ui.lbLoading) return;
  ui.lbLoading = true;
  try {
    const db = await ensureFirebase();
    await publishStats();
    await syncFollowers().catch(() => {});
    const ids = [...new Set([state.profile.playerId, ...state.friends])];
    const docs = await Promise.all(ids.map(id => db.collection('gymdom_players').doc(id).get().then(d => d.exists ? {id, ...d.data()} : null).catch(() => null)));
    ui.lb = docs.filter(Boolean); ui.lbErr = '';
  } catch(e){ ui.lbErr = 'Leaderboard unavailable: ' + (e.message || e); }
  ui.lbLoading = false; ui.lbAt = Date.now();
  if (ui.tab === 'progress') render();
}

function unlocksBetween(a, b){

const RARITY = {common:['Common','#b8c4d6'], rare:['Rare','#4fd1c5'], epic:['Epic','#a78bfa'], legendary:['Legendary','#f2c94c']};
function rollLoot(first){
  if (!first && Math.random() > 0.4) return null;
  const r = Math.random(), rar = first ? 'common' : r < 0.03 ? 'legendary' : r < 0.15 ? 'epic' : r < 0.45 ? 'rare' : 'common';
  const owned = state.cosmetics.owned;
  if (rar === 'epic' || rar === 'legendary'){
    const pool = [...THEMES.filter(t => t[2].loot === rar).map(t => ({kind:'theme', id:t[0], name:t[1]})),
      ...SKINS.filter(s => s[3].loot === rar).map(s => ({kind:'skin', id:s[0], name:s[1], slot:s[2]})),
      ...LOOT_TITLES.filter(t => t[1] === rar).map(t => ({kind:'title', id:'t:' + t[0], name:t[0]}))].filter(x => !owned.includes(x.id));
    if (pool.length){ const it = pool[Math.floor(Math.random() * pool.length)]; owned.push(it.id); return {rar, ...it}; }
    return {rar, kind:'xp', xp: rar === 'legendary' ? 1500 : 750};
  }
  const xp = rar === 'rare' ? 200 + Math.round(Math.random() * 4) * 50 : 50 + Math.round(Math.random() * 4) * 25;

}

  for (const e of entries){ const prev = bestBefore(e.ex); if (prev === null) continue; const ex = EX[e.ex];
    const top = e.sets.reduce((b, s) => e1rm(ex, s) > e1rm(ex, b) ? s : b, e.sets[0]);
    if (e1rm(ex, top) > prev + .01) w.prs.push({ex:e.ex, w:top.w, r:top.r, rm:Math.round(e1rm(ex, top)), prev:Math.round(prev)}); }

  const lvUps = gained.filter(m => lvl(after[m]) > lvl(before[m])).length;

  const confetti = party ? `<div class="confetti">${Array.from({length:30}, (_, i) => `<i style="left:${Math.random()*100}%;background:${[GOLD, TEAL, '#a78bfa', '#f2667a'][i % 4]};animation-delay:${(Math.random()*.7).toFixed(2)}s"></i>`).join('')}</div>` : '';
  openSheet(`<div class="reward">${confetti}<small class="title-tag">Workout complete</small><div class="big">+${fmt(sumObj(w.xp) + bonus)} XP</div>${lootBox(loot)}
    ${plA > plB ? `<div class="banner">PLAYER LEVEL UP · LV ${plA}</div>` : ''}
    ${w.prs.length ? `<div class="pr-box"><h4>🏆 NEW PR${w.prs.length > 1 ? 'S' : ''} · +${w.prs.length * 100} XP</h4>${w.prs.map(p => `<div class="mini-row"><span>${EX[p.ex].name} <small class="mute">${EX[p.ex].bw && !p.w ? 'BW' : p.w}×${p.r}</small></span><span><small class="mute">est. 1RM</small> ${p.prev} → <b style="color:var(--gold)">${p.rm}</b></span></div>`).join('')}</div>` : ''}

const DAYTYPES = {

const REGION = {push:['chest','shoulders','triceps','abs','obliques'], pull:['lats','traps','biceps','forearms','shoulders','abs','obliques','lowerback'],
  legs:['quads','hamstrings','glutes','calves','abs','obliques','lowerback'], lower:['quads','hamstrings','glutes','calves','abs','obliques','lowerback'],
  upper:['chest','shoulders','triceps','biceps','lats','traps','forearms','abs','obliques'], full:Object.keys(MUSCLES)};
const FALL = {delt_front:['delt_side','push_v'], lat_iso:['pull_v'], push_h2:['push_h'], chest_iso:['push_h2','push_h'], delt_side:['push_v'], rear_delt:['pull_h'], traps:['pull_h'], bi:['bi2','pull_v'], bi2:['bi','pull_v'], tri:['tri2','push_h2'], tri2:['tri','push_h2'], quad_iso:['lunge','squat'], ham_iso:['hinge'], glute:['hinge'], forearm:['bi2'], obliq:['core'], core:['obliq']};
const COMPOUND = new Set(['push_h','push_h2','push_v','pull_v','pull_h','squat','hinge','lunge']);
const EQUIP = {full:['bb','db','mc','cb','bw'], db:['db','bw'], bw:['bw']};
const SCHEME = {
  muscle:{name:'Build Muscle', c:[4,'6-10'], i:[3,'10-15'], rest:'Rest 90s–2 min between sets.'},
  strength:{name:'Strength', c:[5,'3-5'], i:[3,'8-10'], rest:'Rest 2–3 min on the big lifts, ~90s on accessories.'},
  recomp:{name:'Recomp', c:[4,'6-8'], i:[3,'10-12'], rest:'Rest 60–90s to keep sessions tight.'},
  fatloss:{name:'Fat Loss', c:[3,'8-12'], i:[3,'12-15'], rest:'Rest 45–75s; pair accessories as supersets.'},
  general:{name:'General Fitness', c:[3,'8-10'], i:[2,'12-15'], rest:'Rest 60–90s.'}
};
function splitTypes(days, goal, exp){
  if (days <= 2) return ['full','full'];
  if (days === 3) return (goal === 'strength' || goal === 'general' || exp === 'beginner') ? ['full','full','full'] : ['push','pull','legs'];
  if (days === 4) return ['upper','lower','upper','lower'];
  if (days === 5) return ['push','pull','legs','upper','lower'];
  return ['push','pull','legs','push','pull','legs'];
}
function pickEx(pat, allowed, used, seed){
  for (const p of [pat, ...(FALL[pat]||[])]){
    const c = EXL.filter(e => e.pat === p && allowed.includes(e.eq) && !used.has(e.id));
    if (c.length) return c[seed % c.length];
  }
  return null;
}
function genPlan(){
  const c = ui.coach, allowed = EQUIP[c.equip], sch = SCHEME[c.goal];
  const types = splitTypes(c.days, c.goal, c.exp), n = {30:4,45:5,60:6,75:7}[c.len];
  const mk = ex => { const comp = COMPOUND.has(ex.pat); let [sets, reps] = comp ? sch.c : sch.i;
    if (c.exp === 'beginner') sets = Math.max(2, sets-1); if (c.exp === 'advanced' && !comp) sets++;
    return {ex:ex.id, sets, reps}; };
  let focus = [...c.focus], weak = [];
  if (c.weak){ const t = muscleTotals(); weak = Object.keys(MUSCLES).filter(m => !focus.includes(m)).sort((a,b) => t[a]-t[b]).slice(0,2); focus.push(...weak); }
  const occ = {};
  const days = types.map((ty, di) => {
    const o = occ[ty] = (occ[ty]||0) + 1, used = new Set(), items = [];
    for (const pat of DAYTYPES[ty].slots.slice(0, n)){ const ex = pickEx(pat, allowed, used, c.seed + o - 1); if (ex){ used.add(ex.id); items.push(mk(ex)); } }
    if (focus.length){
      const rel = focus.filter(m => REGION[ty].includes(m));
      const m = rel.length ? rel[(di + c.seed) % rel.length] : null;
      if (m){ const cand = EXL.filter(e => e.p.includes(m) && allowed.includes(e.eq) && !used.has(e.id));
        if (cand.length){ const ex = cand[(c.seed + di) % cand.length]; used.add(ex.id); items.push({...mk(ex), focus:m}); } }
    }
    const repeat = types.filter(x => x === ty).length > 1;
    if (c.goal === 'fatloss') for (let k = 0; k < items.length - 1; k++){ const iso = x => !COMPOUND.has(EX[x.ex].pat); if (iso(items[k]) && iso(items[k+1])){ items[k].ss = true; k++; } }
    return {name:`Day ${di+1} · ${DAYTYPES[ty].name}${repeat ? ' ' + 'ABC'[o-1] : ''}`, items};
  });
  const notes = [sch.rest,
    'Double progression: once you hit the top of the rep range on every set, add 5 lb (upper body) or 10 lb (lower body) next time.',
    'Leave 1–2 reps in the tank on most sets; push the last set of isolation work closer to failure.',
    c.days >= 5 ? 'Spread rest days so you never do more than 3 days in a row.' : 'Take at least one rest day between sessions that hit the same muscles.'];
  if (c.goal === 'recomp' || c.goal === 'fatloss') notes.push('Keep the weights heavy — the lifting holds onto muscle; your diet drives the fat loss.');
  if (focus.length) notes.push(`Extra focus work added for: ${focus.map(m => MUSCLES[m]).join(', ')}${weak.length ? ` (your lowest-level muscles: ${weak.map(m => MUSCLES[m]).join(', ')})` : ''}.`);
  ui.plan = {name:`${sch.name} · ${c.days}-Day`, days, notes};
}

/* ============ SETTINGS & SYNC ============ */
let fbRef = null, fbUnsub = null, syncStatus = 'Local only';
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function initSync(preferRemote = false){
  if (fbUnsub) fbUnsub(); fbUnsub = null; fbRef = null;
  if (!FIREBASE_CONFIG){ syncStatus = 'Sync off — add your Firebase config at the top of index.html'; return; }
  const code = (state.profile.syncCode || '').trim();
  if (!code){ syncStatus = 'Enter a sync code to sync devices'; return; }
  try {
    fbRef = (await ensureFirebase()).collection('gymdom').doc(code);
    syncStatus = 'Connecting…';
    fbUnsub = fbRef.onSnapshot(snap => {
      const d = snap.data();
      if (d && preferRemote){
        preferRemote = false;
        state = migrate(JSON.parse(d.data)); state.profile.syncCode = code; saveLocal(); render(); toast('Synced from cloud'); setTimeout(backfillNutrition, 500);
      }
      else if (!d || d.updatedAt < state.updatedAt) { preferRemote = false; pushRemote(); }
      else if (d.updatedAt > state.updatedAt){
        const typing = document.activeElement && document.activeElement.tagName === 'INPUT';
        state = migrate(JSON.parse(d.data)); saveLocal();
        if (!typing) render();
      }
      syncStatus = 'Synced · code "' + code + '"';
    }, err => { syncStatus = 'Sync error: ' + err.message; });
  } catch(e){ syncStatus = 'Sync error: ' + (e.message || 'could not load Firebase'); }
}
function pushRemote(){ if (fbRef) fbRef.set({data:JSON.stringify(state), updatedAt:state.updatedAt}).catch(e => syncStatus = 'Sync error: ' + e.message); }

  openSheet(`<div class="row between"><h2 style="margin:0">Settings</h2><button class="icon-btn" data-act="closeSheet">✕</button></div>

    <label class="lbl">Bodyweight (lb) — used for bodyweight-move XP</label><input id="sBw" type="number" inputmode="decimal" value="${esc(state.profile.bw)}">
    <label class="lbl">Sync code</label><input id="sCode" value="${esc(state.profile.syncCode)}" placeholder="Same code on every device"><small class="mute">${esc(syncStatus)}</small>
    <button class="btn block" style="margin-top:14px" data-act="saveSettings">Save</button>
    <label class="lbl">Backup</label><div class="row gap"><button class="btn ghost" style="flex:1" data-act="exportData">Export</button><button class="btn ghost" style="flex:1" data-act="importData">Import</button></div>

  else if (d.sf && ui.edit){ const day = ui.edit.days[+d.d]; if (d.sf === 'dayName') day.name = t.value; else day.items[+d.i][d.sf] = d.sf === 'sets' ? +t.value || '' : t.value; }
  else if (t.id === 'splitName' && ui.edit){ ui.edit.name = t.value; }
  else if (t.id === 'foodQ'){ ui.foodQ = t.value; ui.foodN = 30; renderFoodRes(); }
  else if (t.id === 'amtQ' && ui.amt){ ui.amt.qty = t.value; amtPreview(); }
  else if (t.id === 'amtU' && ui.amt){ ui.amt.unit = t.value; amtPreview(); }
  else if (t.id === 'libq'){ ui.libQ = t.value; ui.libN = PAGE; renderLibList(); }
  else if (t.id === 'pickq' && ui.pick){ ui.pick.q = t.value; ui.pick.n = PAGE; renderPickList(); }
});
document.addEventListener('change', e => { const t = e.target; if (t.id === 'scanFile' && t.files[0]) scanPhoto(t.files[0]); else if (t.id === 'amtU' && ui.amt){ ui.amt.unit = t.value; amtPreview(); } });
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const s = migrate(JSON.parse(await f.text())); const code = state.profile.syncCode; state = s; state.profile.syncCode = state.profile.syncCode || code; save(); closeSheet(); render(); toast('Backup imported'); }
  catch(err){ toast('That file isn\'t a Gymdom backup'); }
  e.target.value = '';
});
setInterval(() => { const el = $('#elapsed'); if (el && state.active){ const s = Math.floor((Date.now() - state.active.start)/1000); el.textContent = `${Math.floor(s/60)}:${String(s%60).padStart(2,'0')}`; } }, 1000);

if (state.active) ui.tab = 'train';
render();
initSync();
setTimeout(backfillNutrition, 2500);
setTimeout(() => { if (FIREBASE_CONFIG) syncFollowers().catch(() => {}); }, 4000);
async function checkForUpdate(){
  try {
    const r = await fetch('version.json?t=' + Date.now(), {cache:'no-store'});
    const {v} = await r.json();
    if (v && v !== APP_VERSION && !document.getElementById('updBar')){
      const b = document.createElement('div'); b.id = 'updBar';
      b.innerHTML = `<span>A new version of Gymdom is ready</span><button class="btn gold sm" id="updGo">Update</button>`;
      document.body.appendChild(b);
      document.getElementById('updGo').onclick = () => location.replace(location.pathname + '?v=' + encodeURIComponent(v));
    }
  } catch(e){}
}
checkForUpdate();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkForUpdate(); });
</script>
</body>
