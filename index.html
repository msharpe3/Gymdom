<style>

function fig(parts, x, col, tap, sk, front){
  let s = `<g transform="translate(${x} 0)">${sk ? skinBehind(sk, front) : ''}<path d="${OUTLINE}" class="base"/>${sk ? skinUnder(sk) : ''}`;
  for (const [m, d, mir] of parts){
    const c = col(m), a = `class="mus" fill="${Array.isArray(c) ? c[0] : c}"${Array.isArray(c) && c[1] < 1 ? ` fill-opacity="${c[1]}"` : ''}${tap ? ` data-act="muscle" data-m="${m}"` : ''}`;
    s += `<path d="${d}" ${a}/>`;
    if (mir) s += `<path d="${d}" ${MIR} ${a}/>`;
  }
  return s + (sk ? skinFront(sk, front) : '') + '</g>';
}

}

    ex.p.forEach(m => xp[m] = (xp[m]||0) + base);

    const offCache = {};

/* ---- Nutrition label photo → numbers (text from on-device OCR) ---- */
const LABEL_DV = {f:78, sat:20, chol:300, na:2300, c:275, fib:28, asug:50, p:50, vd:20, ca:1300, fe:18, pot:4700};
const LABEL_G = ['f','sat','trans','c','fib','sug','asug','p'];
// Order matters: more specific names first (Saturated Fat before Fat, Added Sugars before Sugars)
const LABEL_KEYS = [['k',/calor(?!.*(from fat|a day|diet))/],['sat',/satur|\bsat\b/],['trans',/trans/],['chol',/chol/],['na',/sod/],['fib',/fib(er|re)|dietary/],
  ['asug',/added|incl/],['sug',/sugar/],['c',/carb/],['f',/\bfat/],['p',/prot/],['vd',/vit\w*\.?\s*d\b/],['ca',/calc/],['fe',/\b[il1|!]ron/],['pot',/potas/]];
// Tidy common OCR slips around numbers: O→0, l/I/i→1, S→5, "2 5g"→2.5g, comma decimals, meg→mcg
const LBL_FIX = [[/(\d)[oO]/g, '$10'], [/[oO](\d)/g, '0$1'], [/(\d)[oO]/g, '$10'],
  [/\b[oOQD](?=\s?(?:mcg|meg|mg|g|%)(?![a-z]))/g, '0'], [/\b[iIl|!](?=\s?(?:mcg|meg|mg|g|%)(?![a-z]))/g, '1'], [/\b[sS](?=\s?(?:mcg|meg|mg|g)(?![a-z]))/g, '5'],
  [/(\d),(\d{3})(?!\d)/g, '$1$2'], [/(\d)[lI|](?=\d)/g, '$11'], [/\b[lI|](?=\d)/g, '1'], [/(\d),(\d)(?!\d\d)/g, '$1.$2'], [/(\d) 5(?=\s?g\b)/g, '$1.5'], [/(\d?)\s?meg\b/g, '$1mcg']];
const labelNum = s => LBL_FIX.reduce((t, [re, to]) => t.replace(re, to), s);
function labelTokens(line){
  const out = [], re = /(<\s*)?(\d+(?:\.\d+)?)\s*(mcg|µg|ug|mg|g|%|iu)?/gi; let m;
  while ((m = re.exec(line))) out.push({raw:m[2], v:+m[2], u:(m[3] || '').toLowerCase(), lt:!!m[1]});
  return out;
}
function parseLabel(text){
  const lines = text.split(/\n/).map(l => labelNum(l.trim())).filter(Boolean), got = {}, pct = {}, raw = {};
  let serving = '', grams = 0, per = 0;
  lines.forEach((ln, i) => {
    const lo = ln.toLowerCase();
    if (/serv\w*\s*size/.test(lo)){ serving = ln.replace(/^.*?serv\w*\s*size\s*[:.]?\s*/i, '').replace(/\s{2,}/g, ' ').trim();
      const g = /\((\d+(?:\.\d+)?)\s*g\)/i.exec(ln) || /(\d+(?:\.\d+)?)\s*g\b/i.exec(ln); if (g) grams = +g[1]; return; }
    if (/servings?\s*per/.test(lo)){ const n = /(\d+(?:\.\d+)?)/.exec(ln.replace(/about|approx\.?/i, '')); if (n) per = +n[1]; return; }
    const hit = LABEL_KEYS.find(([k, re]) => re.test(lo) && !(k in got)); if (!hit) return;
    const k = hit[0]; let toks = labelTokens(ln);
    if (k === 'k'){ // calories: the big number can land on the next line
      toks = toks.filter(t => t.u !== '%' && t.v !== 2000 && t.v !== 2500);
      if (!toks.length && lines[i + 1] && !LABEL_KEYS.some(([, re]) => re.test(lines[i + 1].toLowerCase()))) toks = labelTokens(lines[i + 1]).filter(t => t.u !== '%');
      if (toks.length) got.k = toks[0].v; return;
    }
    const val = toks.find(t => t.u !== '%'), pc = toks.find(t => t.u === '%');
    if (pc) pct[k] = pc.v;
    if (val){ got[k] = val.lt ? 0 : val.v; raw[k] = val; }
  });
  // "8g" often reads as "89": when a gram amount has no unit and ends in 9, weigh both readings
  const alt = {};
  LABEL_G.forEach(k => { const t = raw[k]; if (t && !t.u && /\d9$|\.\d*9$/.test(t.raw) && t.raw.length > 1) alt[k] = +t.raw.slice(0, -1); });
  for (const k in alt) if (/\.\d9$/.test(raw[k].raw)){ got[k] = alt[k]; delete alt[k]; } // "2.59" can only be 2.5g
  const fitDV = (k, v) => pct[k] != null && LABEL_DV[k] ? Math.abs(v - pct[k] * LABEL_DV[k] / 100) / Math.max(1, LABEL_DV[k] / 100 * 2) : null;
  for (const k in alt){ const a = fitDV(k, got[k]), b = fitDV(k, alt[k]); if (a != null && b != null){ if (b < a) got[k] = alt[k]; delete alt[k]; } }
  const fix = (k, cap) => { if (k in alt && got[cap] != null && got[k] > got[cap] && alt[k] <= got[cap]){ got[k] = alt[k]; delete alt[k]; } };
  fix('sat', 'f'); fix('trans', 'f'); fix('fib', 'c'); fix('sug', 'c'); fix('asug', 'sug'); fix('asug', 'c');
  if (got.k != null && ['f','c','p'].some(k => k in alt)){ // pick the fat/carb/protein readings that best match the calories
    let best = null; const opts = k => k in alt ? [got[k], alt[k]] : [got[k] ?? 0];
    for (const f of opts('f')) for (const c of opts('c')) for (const p of opts('p')){ const d = Math.abs(9 * f + 4 * c + 4 * p - got.k); if (!best || d < best.d) best = {d, f, c, p}; }
    ['f','c','p'].forEach(k => { if (k in got) got[k] = best[k]; });
  }
  // A %DV with no readable amount still tells us the amount
  for (const k in pct) if (got[k] == null && LABEL_DV[k]){ const v = pct[k] * LABEL_DV[k] / 100;
    got[k] = k === 'vd' || k === 'fe' ? Math.round(v * 10) / 10 : v < 5 ? Math.round(v * 2) / 2 : Math.round(v); }
  if (raw.vd && raw.vd.u === 'iu') got.vd = Math.round(got.vd / 40 * 10) / 10;
  if (got.k == null && (got.f != null || got.c != null || got.p != null)) got.k = Math.round(9 * (got.f || 0) + 4 * (got.c || 0) + 4 * (got.p || 0));
  const x = {}; ['sat','trans','chol','na','fib','sug','asug','vd','ca','fe','pot'].forEach(k => { if (got[k] != null) x[k] = got[k]; });
  return {k:got.k, f:got.f, c:got.c, p:got.p, x, serving, grams, per, found:Object.keys(got).length};
}

const LABEL_ICON = '<svg viewBox="0 0 48 48" width="44" height="44"><rect x="10" y="4" width="28" height="40" rx="3" fill="#fff" stroke="#111" stroke-width="2"/><rect x="14" y="9" width="20" height="4" fill="#111"/><path d="M14 17h20M14 21h20M14 25h14M14 29h20M14 33h12M14 37h17" stroke="#111" stroke-width="2"/><rect x="14" y="14.5" width="20" height="1.6" fill="#111"/></svg>';
function labelCanvas(url){ // shrink big phone photos so reading stays quick

    c.width = Math.round(im.naturalWidth * s); c.height = Math.round(im.naturalHeight * s); c.getContext('2d').drawImage(im, 0, 0, c.width, c.height); res(c); }; im.onerror = rej; im.src = url; });

async function readLabel(file){
  const area = $('#foodArea'); if (!area) return;
  if (ui.labelImg) URL.revokeObjectURL(ui.labelImg);

/* ---- Targets calculator (Mifflin-St Jeor) ---- */
const ACTS = [[1.2,'Sedentary'],[1.375,'Light (1–3 days)'],[1.55,'Moderate (3–5 days)'],[1.725,'Very active (6–7 days)']];
const GOALS = [['cut','Lose fat',0.8,1.0],['recomp','Recomp',0.9,1.0],['maintain','Maintain',1.0,0.8],['bulk','Lean bulk',1.1,0.8]];
function calcTargets(fp){
  const lb = +fp.lb, kg = lb * 0.4536, cm = ((+fp.ft) * 12 + (+fp.inch)) * 2.54, age = +fp.age;
  if (!(lb > 50 && cm > 100 && age >= 13)) return null;
  const bmr = 10 * kg + 6.25 * cm - 5 * age + (fp.sex === 'f' ? -161 : 5);
  const goal = GOALS.find(g => g[0] === fp.goal) || GOALS[1];
  const kcal = Math.max(fp.sex === 'f' ? 1200 : 1500, Math.round(bmr * fp.act * goal[2] / 10) * 10);
  const p = Math.round(lb * goal[3]), f = Math.round(kcal * 0.27 / 9), c = Math.max(0, Math.round((kcal - p * 4 - f * 9) / 4));
  return {kcal, p, c, f};
}
function openTargets(){
  const fp = ui.tp = {...state.foodProfile, lb: state.foodProfile.lb || state.profile.bw || 180};
  const t = state.foodTargets || calcTargets(fp) || {kcal:'', p:'', c:'', f:''};
  const chip = (k, v, l) => `<button class="chip${String(fp[k]) === String(v) ? ' on' : ''}" data-act="tpSet" data-k="${k}" data-v="${v}">${l}</button>`;
  openSheet(`<div class="row between"><h2 style="margin:0">Daily targets</h2><button class="icon-btn" data-act="closeSheet">✕</button></div>
    <label class="lbl">Sex</label><div class="chips">${chip('sex','m','Male')}${chip('sex','f','Female')}</div>
    <div class="mgrid"><div><label class="lbl">Age</label><input id="tpAge" type="number" inputmode="numeric" value="${fp.age || ''}"></div><div><label class="lbl">Weight (lb)</label><input id="tpLb" type="number" inputmode="decimal" value="${fp.lb || ''}"></div>
    <div><label class="lbl">Height (ft)</label><input id="tpFt" type="number" inputmode="numeric" value="${fp.ft || ''}"></div><div><label class="lbl">Height (in)</label><input id="tpIn" type="number" inputmode="numeric" value="${fp.inch ?? ''}"></div></div>
    <label class="lbl">Activity</label><div class="chips wrap">${ACTS.map(([v, l]) => chip('act', v, l)).join('')}</div>
    <label class="lbl">Goal</label><div class="chips wrap">${GOALS.map(([v, l]) => chip('goal', v, l)).join('')}</div>
    <button class="btn block" style="margin-top:14px" data-act="tpCalc">Calculate</button>
    <label class="lbl">Your targets (edit any number)</label>
    <div class="mgrid"><div><label class="lbl">Calories</label><input id="tK" type="number" inputmode="numeric" value="${t.kcal}"></div><div><label class="lbl">Protein (g)</label><input id="tP" type="number" inputmode="numeric" value="${t.p}"></div>
    <div><label class="lbl">Carbs (g)</label><input id="tC" type="number" inputmode="numeric" value="${t.c}"></div><div><label class="lbl">Fat (g)</label><input id="tF" type="number" inputmode="numeric" value="${t.f}"></div></div>
    <p class="mute" style="font-size:12px">These are estimates. If your weight trend isn't moving the way you want after 2–3 weeks, nudge calories by about 100–200.</p>
    <button class="btn gold block" data-act="tpSave">Save targets</button>`);
}

const FV = () => firebase.firestore.FieldValue;

async function syncFollowers(){
  if (!FIREBASE_CONFIG) return [];
  const db = await ensureFirebase(), me = state.profile.playerId, col = db.collection('gymdom_players');
  if (!followSynced){ followSynced = true;  // let everyone we've added know (covers friends added before requests existed)
    await Promise.all(state.friends.map(id => col.doc(id).set({followers: FV().arrayUnion(me)}, {merge:true}).catch(() => {}))); }
  const mine = await col.doc(me).get(), followers = (mine.exists && mine.data().followers) || [];
  const pending = followers.filter(id => id && id !== me && !state.friends.includes(id) && !(state.friendsRemoved || []).includes(id));
  const docs = await Promise.all(pending.map(id => col.doc(id).get().then(d => d.exists ? {id, ...d.data()} : null).catch(() => null)));
  const reqs = docs.filter(Boolean), seen = state.reqSeen || [], fresh = reqs.filter(r => !seen.includes(r.id));

  if (fresh.length){

}

/* ---- Replace an exercise mid-workout with a similar one ---- */
const MOVE_KW = [['legext',/leg extension|quad extension/],['legcurl',/leg curl|hamstring curl|nordic/],['adduct',/adduct/],['abduct',/abduct/],['press',/\bpress\b/],['bench',/bench/],['curl',/curl/],['row',/\brow/],['fly',/\bfly|flye/],['squat',/squat/],['lunge',/lunge|split squat|step.?up/],['deadlift',/deadlift|rdl|romanian/],

  ['crunch',/crunch|sit.?up|leg raise|knee raise/],['plank',/plank|hollow|dead bug/],['thrust',/hip thrust|glute bridge|bridge/],['legpress',/leg press|hack squat/],['facepull',/face pull|reverse fly|rear delt/],['pullover',/pullover/]];

  const p0 = ex0.p || [], s0 = ex0.s || [], kw0 = moveKw(ex0.name), used = new Set((state.active?.entries || []).map(e => e.ex));
  return Object.values(EX).filter(e => e.id !== id && !used.has(e.id)).map(e => {
    const po = (e.p || []).filter(m => p0.includes(m)).length; if (!po) return null;
    const so = (e.s || []).filter(m => s0.includes(m) || p0.includes(m)).length, kw = moveKw(e.name);
    let sc = 4 * po / Math.max(p0.length, (e.p || []).length) + so / Math.max(1, s0.length) + (kw0 && kw === kw0 ? 2.5 : 0)
      - (kw0 && kw && kw !== kw0 ? 1.5 : 0)

const DAYTYPES = {
  full:{name:'Full Body', slots:['squat','push_h','pull_v','hinge','push_v','pull_h','bi','tri','core']},
  upper:{name:'Upper', slots:['push_h','pull_h','push_v','pull_v','delt_side','tri','bi']},
  lower:{name:'Lower', slots:['squat','hinge','lunge','ham_iso','quad_iso','calf','core']},
  push:{name:'Push', slots:['push_h','push_v','push_h2','delt_side','tri','chest_iso','tri2']},
  pull:{name:'Pull', slots:['pull_v','pull_h','rear_delt','bi','traps','bi2','forearm']},
  legs:{name:'Legs', slots:['squat','hinge','lunge','quad_iso','ham_iso','calf','core']}
};
const REGION = {push:['chest','shoulders','triceps','abs','obliques'], pull:['lats','traps','biceps','forearms','shoulders','abs','obliques','lowerback'],
  legs:['quads','hamstrings','glutes','calves','abs','obliques','lowerback'], lower:['quads','hamstrings','glutes','calves','abs','obliques','lowerback'],
  upper:['chest','shoulders','triceps','biceps','lats','traps','forearms','abs','obliques'], full:Object.keys(MUSCLES)};
const FALL = {delt_front:['delt_side','push_v'], lat_iso:['pull_v'], push_h2:['push_h'], chest_iso:['push_h2','push_h'], delt_side:['push_v'], rear_delt:['pull_h'], traps:['pull_h'], bi:['bi2','pull_v'], bi2:['bi','pull_v'], tri:['tri2','push_h2'], tri2:['tri','push_h2'], quad_iso:['lunge','squat'], ham_iso:['hinge'], glute:['hinge'], forearm:['bi2'], obliq:['core'], core:['obliq']};
const COMPOUND = new Set(['push_h','push_h2','push_v','pull_v','pull_h','squat','hinge','lunge']);
const EQUIP = {full:['bb','db','mc','cb','bw'], db:['db','bw'], bw:['bw']};
const SCHEME = {
  muscle:{name:'Build Muscle', c:[4,'6-10'], i:[3,'10-15'], rest:'Rest 90s–2 min between sets.'},
  strength:{name:'Strength', c:[5,'3-5'], i:[3,'8-10'], rest:'Rest 2–3 min on the big lifts, ~90s on accessories.'},
  recomp:{name:'Recomp', c:[4,'6-8'], i:[3,'10-12'], rest:'Rest 60–90s to keep sessions tight.'},
  fatloss:{name:'Fat Loss', c:[3,'8-12'], i:[3,'12-15'], rest:'Rest 45–75s; pair accessories as supersets.'},
  general:{name:'General Fitness', c:[3,'8-10'], i:[2,'12-15'], rest:'Rest 60–90s.'}
};
function splitTypes(days, goal, exp){
  if (days <= 2) return ['full','full'];
  if (days === 3) return (goal === 'strength' || goal === 'general' || exp === 'beginner') ? ['full','full','full'] : ['push','pull','legs'];
  if (days === 4) return ['upper','lower','upper','lower'];
  if (days === 5) return ['push','pull','legs','upper','lower'];
  return ['push','pull','legs','push','pull','legs'];
}
function pickEx(pat, allowed, used, seed){
  for (const p of [pat, ...(FALL[pat]||[])]){
    const c = EXL.filter(e => e.pat === p && allowed.includes(e.eq) && !used.has(e.id));
    if (c.length) return c[seed % c.length];
  }
  return null;
}
function genPlan(){
  const c = ui.coach, allowed = EQUIP[c.equip], sch = SCHEME[c.goal];
  const types = splitTypes(c.days, c.goal, c.exp), n = {30:4,45:5,60:6,75:7}[c.len];
  const mk = ex => { const comp = COMPOUND.has(ex.pat); let [sets, reps] = comp ? sch.c : sch.i;
    if (c.exp === 'beginner') sets = Math.max(2, sets-1); if (c.exp === 'advanced' && !comp) sets++;
    return {ex:ex.id, sets, reps}; };
  let focus = [...c.focus], weak = [];
  if (c.weak){ const t = muscleTotals(); weak = Object.keys(MUSCLES).filter(m => !focus.includes(m)).sort((a,b) => t[a]-t[b]).slice(0,2); focus.push(...weak); }
  const occ = {};
  const days = types.map((ty, di) => {
    const o = occ[ty] = (occ[ty]||0) + 1, used = new Set(), items = [];
    for (const pat of DAYTYPES[ty].slots.slice(0, n)){ const ex = pickEx(pat, allowed, used, c.seed + o - 1); if (ex){ used.add(ex.id); items.push(mk(ex)); } }
    if (focus.length){
      const rel = focus.filter(m => REGION[ty].includes(m));
      const m = rel.length ? rel[(di + c.seed) % rel.length] : null;
      if (m){ const cand = EXL.filter(e => e.p.includes(m) && allowed.includes(e.eq) && !used.has(e.id));
        if (cand.length){ const ex = cand[(c.seed + di) % cand.length]; used.add(ex.id); items.push({...mk(ex), focus:m}); } }
    }
    const repeat = types.filter(x => x === ty).length > 1;
    if (c.goal === 'fatloss') for (let k = 0; k < items.length - 1; k++){ const iso = x => !COMPOUND.has(EX[x.ex].pat); if (iso(items[k]) && iso(items[k+1])){ items[k].ss = true; k++; } }
    return {name:`Day ${di+1} · ${DAYTYPES[ty].name}${repeat ? ' ' + 'ABC'[o-1] : ''}`, items};
  });
  const notes = [sch.rest,
    'Double progression: once you hit the top of the rep range on every set, add 5 lb (upper body) or 10 lb (lower body) next time.',
    'Leave 1–2 reps in the tank on most sets; push the last set of isolation work closer to failure.',
    c.days >= 5 ? 'Spread rest days so you never do more than 3 days in a row.' : 'Take at least one rest day between sessions that hit the same muscles.'];
  if (c.goal === 'recomp' || c.goal === 'fatloss') notes.push('Keep the weights heavy — the lifting holds onto muscle; your diet drives the fat loss.');
  if (focus.length) notes.push(`Extra focus work added for: ${focus.map(m => MUSCLES[m]).join(', ')}${weak.length ? ` (your lowest-level muscles: ${weak.map(m => MUSCLES[m]).join(', ')})` : ''}.`);
  ui.plan = {name:`${sch.name} · ${c.days}-Day`, days, notes};
}

let fbRef = null, fbUnsub = null, syncStatus = 'Local only';
function loadScript(src){ return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = rej; document.head.appendChild(s); }); }
async function initSync(preferRemote = false){
  if (fbUnsub) fbUnsub(); fbUnsub = null; fbRef = null;
  if (!FIREBASE_CONFIG){ syncStatus = 'Sync off — add your Firebase config at the top of index.html'; return; }
  const code = (state.profile.syncCode || '').trim();
  if (!code){ syncStatus = 'Enter a sync code to sync devices'; return; }
  try {
    fbRef = (await ensureFirebase()).collection('gymdom').doc(code);
    syncStatus = 'Connecting…';
    fbUnsub = fbRef.onSnapshot(snap => {
      const d = snap.data();
      if (d && preferRemote){
        preferRemote = false;
        state = migrate(JSON.parse(d.data)); state.profile.syncCode = code; saveLocal(); render(); toast('Synced from cloud'); setTimeout(backfillNutrition, 500);
      }
      else if (!d || d.updatedAt < state.updatedAt) { preferRemote = false; pushRemote(); }
      else if (d.updatedAt > state.updatedAt){
        const typing = document.activeElement && document.activeElement.tagName === 'INPUT';
        state = migrate(JSON.parse(d.data)); saveLocal();
        if (!typing) render();
      }
      syncStatus = 'Synced · code "' + code + '"';
    }, err => { syncStatus = 'Sync error: ' + err.message; });
  } catch(e){ syncStatus = 'Sync error: ' + (e.message || 'could not load Firebase'); }
}
function pushRemote(){ if (fbRef) fbRef.set({data:JSON.stringify(state), updatedAt:state.updatedAt}).catch(e => syncStatus = 'Sync error: ' + e.message); }

document.addEventListener('focusout', e => { const t = e.target; if (t.classList && t.classList.contains('nl-edit') && !t.dataset.done && ui.nlEdit === t.dataset.id){ t.dataset.done = 1; nlCommit(t.dataset.id, t.value); } });
document.addEventListener('change', e => { const t = e.target;
  if (t.id === 'plStart' && ui.pl){ const v = +t.value; if (t.value !== '' && v >= 0){ ui.pl.start = v; plRemember(); renderPlates(); } return; } if (t.id === 'scanFile' && t.files[0]) scanPhoto(t.files[0]); else if ((t.id === 'labelFile' || t.id === 'labelFile2') && t.files[0]) readLabel(t.files[0]); else if (t.id === 'amtU' && ui.amt){ ui.amt.unit = t.value; amtPreview(); } });
$('#importFile').addEventListener('change', async e => {
  const f = e.target.files[0]; if (!f) return;
  try { const s = migrate(JSON.parse(await f.text())); const code = state.profile.syncCode; state = s; state.profile.syncCode = state.profile.syncCode || code; save(); closeSheet(); render(); toast('Backup imported'); }
  catch(err){ toast('That file isn\'t a Gymdom backup'); }
  e.target.value = '';
});

/* ---- Rest timer: starts when you log a set's reps; beeps + buzzes when it's time for the next set ---- */
const REST_PRESETS = [60, 90, 120, 150, 180, 240];
const mmss = x => `${Math.floor(x / 60)}:${String(x % 60).padStart(2, '0')}`;
let audioCtx = null;
function unlockAudio(){ try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); if (audioCtx.state === 'suspended') audioCtx.resume(); } catch(e){} }
function restAlarm(){
  if (navigator.vibrate) navigator.vibrate([250, 120, 250, 120, 400]);
  try { unlockAudio(); const t0 = audioCtx.currentTime;
    [0, .22, .44].forEach((d, k) => { const o = audioCtx.createOscillator(), g = audioCtx.createGain(); o.type = 'sine'; o.frequency.value = k === 2 ? 1320 : 880;
      g.gain.setValueAtTime(.0001, t0 + d); g.gain.exponentialRampToValueAtTime(.35, t0 + d + .02); g.gain.exponentialRampToValueAtTime(.0001, t0 + d + .18);
      o.connect(g).connect(audioCtx.destination); o.start(t0 + d); o.stop(t0 + d + .2); }); } catch(e){}
}
function startRest(sec){ const a = state.active; if (!a || a.paused) return; sec = sec || state.restSec || 90; a.rest = {end:Date.now() + sec * 1000, total:sec}; save(); unlockAudio(); restTick(true); }
function stopRest(){ if (state.active && state.active.rest){ delete state.active.rest; save(); } restTick(true); }
function restTick(force){
  const bar = $('#restBar'); if (!bar) return;
  const r = state.active && !state.active.paused && state.active.rest;
  if (!r || Date.now() - r.end > 5 * 60e3){ if (r && r.left == null) stopRest(); bar.hidden = true; bar.dataset.mode = ''; document.body.classList.remove('resting'); return; }
  const left = Math.ceil((r.end - Date.now()) / 1000), mode = left > 0 ? 'run' : 'over';
  bar.hidden = false; document.body.classList.add('resting');
  if (mode === 'over' && !r.done){ r.done = true; save(); restAlarm(); }
  if (force || bar.dataset.mode !== mode){
    bar.dataset.mode = mode; bar.classList.toggle('over', mode === 'over');
    bar.innerHTML = mode === 'run'
      ? `<i class="rest-fill" id="restFill"></i><span class="rest-lbl">⏱ REST</span><b id="restTime"></b><button data-act="restAdj" data-v="-15">−15</button><button data-act="restAdj" data-v="15">+15</button><button data-act="restDef" class="rest-def" id="restDef">${mmss(state.restSec)}</button><button data-act="restSkip" class="rest-x" aria-label="Skip rest">Skip</button>`
      : `<span class="rest-lbl">💪 REST'S UP</span><b>Next set!</b><small id="restTime"></small><button data-act="restAdj" data-v="30">+30s</button><button data-act="restSkip" class="rest-x" aria-label="Dismiss">✕</button>`;
  }
  const t = $('#restTime');
  if (mode === 'run'){ t.textContent = mmss(left); const f = $('#restFill'); if (f) f.style.width = Math.max(0, Math.min(100, left / r.total * 100)) + '%'; }
  else t.textContent = '+' + mmss(Math.floor((Date.now() - r.end) / 1000));
}
setInterval(restTick, 250);
document.addEventListener('pointerdown', unlockAudio, {once:true});
document.addEventListener('change', e => { const t = e.target, d = t.dataset;  // logging reps on a set starts the rest timer
  if (d.f === 'r' && state.active && +t.value > 0){ const en = state.active.entries[+d.e]; if (en && !en.ss) startRest(); } });
// Workout clock leaves out paused time
function workoutSecs(a){ const now = Date.now(); return Math.max(0, Math.floor((now - a.start - (a.pausedMs || 0) - (a.paused ? now - a.paused : 0)) / 1000)); }
setInterval(() => { const el = $('#elapsed'); if (el && state.active) el.textContent = mmss(workoutSecs(state.active)); }, 1000);

if (state.active) ui.tab = 'train';
try { if (claimSeason().length) saveLocal(); } catch(e){}
try { if (claimPlates().length) saveLocal(); } catch(e){}
render();
initSync();
setTimeout(backfillNutrition, 2500);
setTimeout(() => { if (FIREBASE_CONFIG) syncFollowers().catch(() => {}); }, 4000);
async function checkForUpdate(){
  try {
    const r = await fetch('version.json?t=' + Date.now(), {cache:'no-store'});
    const {v} = await r.json();
    if (v && v !== APP_VERSION && !document.getElementById('updBar')){
      const b = document.createElement('div'); b.id = 'updBar';
      b.innerHTML = `<span>A new version of Gymdom is ready</span><button class="btn gold sm" id="updGo">Update</button>`;
      document.body.appendChild(b);
      document.getElementById('updGo').onclick = () => location.replace(location.pathname + '?v=' + encodeURIComponent(v));
    }
  } catch(e){}
}
checkForUpdate();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') checkForUpdate(); });
</script>
